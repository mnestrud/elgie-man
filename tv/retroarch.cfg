# RetroArch settings for an LG CX with the library on a network share (see tv/emu-hook.sh).
# Goes to /media/developer/.config/retroarch/retroarch.cfg.
config_save_on_exit = "false"

# Everything shared comes from the share; only this file lives on the TV.
libretro_directory = "/media/developer/emu/cores"
libretro_info_path = "/media/developer/emu/info"
assets_directory = "/media/developer/emu/assets"
system_directory = "/media/developer/emu/rw/system"
rgui_browser_directory = "/media/developer/emu/roms"
playlist_directory = "/media/developer/emu/playlists"
thumbnails_directory = "/media/developer/emu/thumbnails"
content_database_path = "/media/developer/emu/database/rdb"
cheat_database_path = "/media/developer/emu/cheats/cht"
video_shader_dir = "/media/developer/emu/shaders"
joypad_autoconfig_dir = "/media/developer/emu/autoconfig"
savefile_directory = "/media/developer/emu/rw/saves"
savestate_directory = "/media/developer/emu/rw/states"
rgui_config_directory = "/media/developer/emu/rw/config"
screenshot_directory = "/media/developer/emu/rw/screenshots"
log_dir = "/media/developer/emu/rw/logs"
runtime_log_directory = "/media/developer/emu/rw/runtime"
content_history_directory = "/media/developer/emu/rw/history"
content_favorites_directory = "/media/developer/emu/rw/history"
content_music_history_directory = "/media/developer/emu/rw/history"
content_image_history_directory = "/media/developer/emu/rw/history"
content_video_history_directory = "/media/developer/emu/rw/history"
cache_directory = "/tmp/retroarch-cache"
core_info_cache_enable = "false"
sort_savefiles_by_content_enable = "true"
sort_savestates_by_content_enable = "true"

# Picture
video_driver = "gl"
video_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_scale_integer = "false"
aspect_ratio_index = "22"
video_refresh_rate = "60.000000"

# Sound
audio_driver = "pulse"
audio_latency = "64"
audio_rate_control = "true"

# Menu
menu_driver = "ozone"
menu_swap_ok_cancel_buttons = "true"
menu_show_core_updater = "false"
menu_show_online_updater = "false"
menu_thumbnails = "3"
menu_left_thumbnails = "1"
network_on_demand_thumbnails = "false"
playlist_use_filename = "false"
menu_pause_libretro = "true"

# Pads
input_joypad_driver = "sdl2"
input_autodetect_enable = "true"
input_menu_toggle_gamepad_combo = "4"
input_quit_gamepad_combo = "0"
